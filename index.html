<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Candy Factory _ Shop</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffcddb; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #ffcddb; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #5a1f4a; transition: opacity .3s; }
    #loading h1 { margin: 0; font-size: 26px; letter-spacing: .04em; }
    #bar { width: min(60vw, 320px); height: 14px; border-radius: 7px; background: rgba(90, 31, 74, .15); overflow: hidden; }
    #fill { width: 0; height: 100%; border-radius: 7px; background: #ff6f9f; transition: width .15s; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><h1>Candy Factory _ Shop</h1><div id="bar"><div id="fill"></div></div></div>
  <script>
    // The canvas fills the whole window (desktop or phone); Unity renders at its real size.
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var fill = document.querySelector("#fill");
    var config = {
      arguments: [],
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Candy Factory",
      productName: "Candy Factory _ Shop",
      productVersion: "1.0.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { fill.style.width = (100 * p) + "%"; })
        .then(function () { loading.style.opacity = 0; setTimeout(function () { loading.remove(); }, 300); canvas.focus(); })
        .catch(function (m) { alert(m); });
    };
    document.body.appendChild(script);
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
  </script>
</body>
</html>
